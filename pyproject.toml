[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gchi"
version = "1.0.0b1"
description = "Global Climate Health Index — climate-based threats to human health"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "xarray",
    "pandas",
    "scipy",
    "numba",
    "xesmf",
    "netcdf4",
    "h5netcdf"
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gchi*"]
